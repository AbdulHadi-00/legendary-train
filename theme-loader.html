<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Profile Lock Pro</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="i18n.js"></script>
    <script src="totp.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme-fixes.css">
    <link rel="stylesheet" href="theme-additions.css">
    <style>
        .container { max-width: 500px; }
    </style>
    <link rel="icon" type="image/png" href="H_icon.png">
</head>

<body>
    <canvas id="matrix-canvas"></canvas>
    <div class="glow-orb" id="orb-1"></div>
    <div class="glow-orb" id="orb-2"></div>
    <div class="glow-orb" id="orb-3"></div>
    <div class="gold-streak" id="streak-1"></div>
    <div class="gold-streak" id="streak-2"></div>

    <!-- Theme cards are patched by the script below because this file is intentionally a lightweight patch loader. -->
    <script>
        const section = document.querySelector('.theme-picker-grid');
        if (section) {
            const additions = [
                ['nature', '#84cc16', 'Nature Green'],
                ['peaceful', '#f8fafc', 'Peaceful White']
            ];
            additions.forEach(([theme, color, label]) => {
                if (document.querySelector(`[data-theme="${theme}"]`)) return;
                const card = document.createElement('div');
                card.className = 'theme-card';
                card.dataset.theme = theme;
                card.innerHTML = `<div class="theme-preview-dot" style="background:${color};"></div><span style="font-size:0.82rem;font-weight:600;">${label}</span>`;
                section.appendChild(card);
            });
        }
    </script>

    <script src="options.js"></script>
</body>

</html>
