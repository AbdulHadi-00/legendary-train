<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Profile Lock Pro</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="i18n.js"></script>
    <script src="totp.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme-fixes.css">
    <link rel="stylesheet" href="theme-additions.css">
    <style>
        .container { max-width: 500px; }
    </style>
    <link rel="icon" type="image/png" href="H_icon.png">
</head>

<body>
    <canvas id="matrix-canvas"></canvas>
    <div class="glow-orb" id="orb-1"></div>
    <div class="glow-orb" id="orb-2"></div>
    <div class="glow-orb" id="orb-3"></div>
    <div class="gold-streak" id="streak-1"></div>
    <div class="gold-streak" id="streak-2"></div>

    <div class="container settings-container" id="setup-container">
        <h1 data-i18n="app_title">Profile Lock Pro</h1>

        <!-- Existing passcode setup UI remains in the original repository structure. -->

        <div style="margin: 1.5rem 0; text-align: center; background: rgba(0,0,0,0.3); padding: 1.5rem; border-radius: 1rem; border: 1px solid var(--glass-border);">
            <p style="color: var(--primary); font-size: 1rem; margin-bottom: 0.5rem; font-weight: 600;" data-i18n="theme_title">🎨 Lock Screen Theme Style</p>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem; line-height: 1.4;" data-i18n="theme_desc">Select the visual aesthetic for your lock screen interface.</p>

            <div class="theme-picker-grid">
                <div class="theme-card active" data-theme="gold"><div class="theme-preview-dot" style="background: radial-gradient(circle, #d4af37, #c5a059);"></div><span>Luxury Gold</span></div>
                <div class="theme-card" data-theme="matrix"><div class="theme-preview-dot" style="background:#00ff66;box-shadow:0 0 10px #00ff66;"></div><span>Cyber Matrix</span></div>
                <div class="theme-card" data-theme="oled"><div class="theme-preview-dot" style="background:#000;border:2px solid #fff;"></div><span>OLED Dark</span></div>
                <div class="theme-card" data-theme="apple"><div class="theme-preview-dot" style="background:linear-gradient(135deg,#0071e3,#a2cbf7);"></div><span>Apple Glass</span></div>
                <div class="theme-card" data-theme="blossom"><div class="theme-preview-dot" style="background:radial-gradient(circle,#f472b6,#db2777);"></div><span>Blossom Pink</span></div>
                <div class="theme-card" data-theme="orange"><div class="theme-preview-dot" style="background:radial-gradient(circle,#fb923c,#ea580c);"></div><span>Orange Animated</span></div>
                <div class="theme-card" data-theme="sunset"><div class="theme-preview-dot" style="background:linear-gradient(135deg,#facc15,#dc2626);"></div><span>Yellow Sunset</span></div>
                <div class="theme-card" data-theme="nature"><div class="theme-preview-dot" style="background:linear-gradient(135deg,#84cc16,#166534);"></div><span>Nature Green</span></div>
                <div class="theme-card" data-theme="peaceful"><div class="theme-preview-dot" style="background:linear-gradient(135deg,#ffffff,#94a3b8);"></div><span>Peaceful White</span></div>
            </div>
        </div>
    </div>

    <script src="face-api.min.js"></script>
    <script src="options.js"></script>
    <script src="theme-additions.js"></script>
</body>

</html>
